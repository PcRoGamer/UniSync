[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unisync"
version = "0.1.0"
description = "Universal University Sync Platform for Echo360, Canvas, EdStem, and University Email."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "UniSync Team" }
]
keywords = ["canvas", "echo360", "edstem", "email-monitor", "university-sync", "fastapi"]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.6",
    "anyio>=4.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.0",
    "txtai>=7.0.0",
    "faiss-cpu>=1.7.4",
    "flashrank>=0.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
